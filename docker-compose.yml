services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydb
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  bot:
    build: ./bot
    env_file:
      - ./bot/.env
    ports:
      - "8100:8100"

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      # Внутри docker-сети сервисы обращаются друг к другу по имени сервиса,
      # а не по localhost/хост-портам из .env (те нужны для локального запуска через venv).
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/mydb
      DATABASE_URL_SQLALCHEMY: postgresql+asyncpg://postgres:postgres@postgres:5432/mydb
      REDIS_URL: redis://redis:6379/0
      BOT_SERVICE_URL: http://bot:8100
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      bot:
        condition: service_started
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        # Vite bakes this into the bundle at build time — it's the URL the
        # *browser* will call, so the host-mapped backend port, not the
        # in-network service name.
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    depends_on:
      - backend
    ports:
      - "3000:80"

  admin:
    build:
      context: ./admin
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    depends_on:
      - backend
    ports:
      - "3001:80"

volumes:
  pgdata:
  redisdata:
